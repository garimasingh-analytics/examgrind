meta:
  product: ExamGrind
  version: 1.3.0
  created: 2026-07-26
  updated: 2026-08-14
  implementation: ga4_gtag
  destinations: [ga4, google_ads, meta_pixel]
  pii_policy: none
  internal_user_policy: none

entities:
  user:
    id_property: none
    id_format: anonymous browser session
    traits: []

groups: []

events:
  - name: daily_mission_started
    category: core_value
    description: Student chooses the dashboard's recommended study action.
    properties:
      - { name: mission_type, type: string, required: true, enum: [foundation, repair, revision, advance] }
  - name: daily_mission_completed
    category: core_value
    description: Student completes a non-empty quiz begun from the current dashboard mission.
    properties:
      - { name: mission_type, type: string, required: true, enum: [foundation, repair, revision, advance] }
      - { name: question_count, type: integer, required: true }
      - { name: correct_count, type: integer, required: true }
  - name: quiz_completed
    category: core_value
    description: Student completes a quiz.
    properties:
      - { name: question_count, type: integer, required: true }
      - { name: answered_count, type: integer, required: true }
      - { name: correct_count, type: integer, required: true }
      - { name: duration_seconds, type: integer, required: true }
  - name: deep_analysis_completed
    category: core_value
    description: A requested analysis is rendered successfully.
    properties:
      - { name: analysis_kind, type: string, required: true, enum: [regular, deep_dive] }
      - { name: source, type: string, required: true, enum: [quiz, mock] }
  - name: subscription_purchased
    category: billing
    description: A verified Razorpay purchase returns control to the app.
    properties:
      - { name: plan, type: string, required: true, enum: [monthly_199, annual_899] }
  - name: paywall_viewed
    category: conversion
    description: Student sees the access-choice modal.
    properties:
      - { name: paywall_reason, type: string, required: true }
  - name: access_option_selected
    category: conversion
    description: Student selects an offer before Razorpay opens.
    properties:
      - { name: product, type: string, required: true, enum: [analysis_credit, score_boost_21d, quiz_pack_3, quiz_pack_10, quiz_pack_15, coach_monthly, coach_yearly] }
      - { name: paywall_reason, type: string, required: true }
  - name: checkout_opened
    category: conversion
    description: Razorpay checkout has opened after an offer selection.
    properties:
      - { name: product, type: string, required: true }
      - { name: checkout_type, type: string, required: true, enum: [one_time, subscription] }
  - name: checkout_dismissed
    category: conversion
    description: Student closes Razorpay checkout before completion.
    properties:
      - { name: product, type: string, required: true }
      - { name: checkout_type, type: string, required: true, enum: [one_time, subscription] }
  - name: purchase_completed
    category: conversion
    description: A successful client payment return has been verified or acknowledged.
    properties:
      - { name: product, type: string, required: true }
      - { name: checkout_type, type: string, required: true, enum: [one_time, subscription] }
  - name: diagnosis_signup_completed
    category: conversion
    description: A visitor who began at the free diagnosis finishes account creation within 30 minutes.
    properties:
      - { name: exam, type: string, required: true, enum: [cuet, ssc-cgl, neet-ug] }
  - name: diagnosis_handoff_viewed
    category: activation
    description: A new account reaches Home with a short-lived diagnosis signal.
    properties:
      - { name: exam, type: string, required: true, enum: [cuet, ssc-cgl, neet-ug] }
      - { name: wrong_count, type: integer, required: true }
  - name: diagnosis_handoff_action
    category: activation
    description: Student acts on, bypasses, or dismisses the diagnosis handoff.
    properties:
      - { name: exam, type: string, required: true, enum: [cuet, ssc-cgl, neet-ug] }
      - { name: action, type: string, required: true, enum: [follow_signal, choose_subject, read_guide, dismiss] }
  - name: study_hub_viewed
    category: activation
    description: Student views the public Study Hub or official updates desk.
    properties:
      - { name: surface, type: string, required: true, enum: [guides, updates] }
      - { name: exam_scope, type: string, required: true, enum: [ssc-cgl, cuet, neet-ug, all] }
  - name: study_guide_viewed
    category: activation
    description: Student opens a specific public exam-preparation guide.
    properties:
      - { name: exam, type: string, required: true, enum: [cuet, ssc-cgl, neet-ug] }
      - { name: guide_slug, type: string, required: true }
  - name: repair_round_started
    category: core_value
    description: A student opens a fresh-question targeted repair drill.
    properties: []
  - name: repair_proof_viewed
    category: core_value
    description: A completed repair's fresh-question result is visible.
    properties: []
  - name: recovery_history_viewed
    category: retention
    description: Student views their active and completed repair history.
    properties:
      - { name: active_count, type: integer, required: true }
      - { name: completed_count, type: integer, required: true }
